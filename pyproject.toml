[project]
name = "kql-eval"
version = "0.1.0"
description = "Measured evaluation of natural-language to KQL generation for security questions"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kql_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

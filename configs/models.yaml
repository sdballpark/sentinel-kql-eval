# Model registry — weights live in $HF_HOME, never in this repo.
# revision: pin to a commit SHA before any result you intend to publish.
registry_version: 1
project: CHANGEME

models:
  image_text_embedding:
    repo_id: google/siglip2-base-patch16-224
    revision: main
    license: apache-2.0
    purpose: text-to-image search
    precision: fp16

  visual_embedding:
    repo_id: facebook/dinov2-base
    revision: main
    license: apache-2.0
    purpose: visual similarity, dedup, clustering
    precision: fp16

  vision_language:
    repo_id: Qwen/Qwen3-VL-4B-Instruct
    revision: main
    license: apache-2.0
    purpose: captioning, entity extraction
    precision: bf16
